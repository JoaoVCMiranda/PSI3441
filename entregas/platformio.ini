; PlatformIO Project Configuration File
; FRDM-KL25Z + Zephyr OS — abordagem híbrida
;
; Fontes: src/main.c + src/pwm_z42.c (cópia de 5/pwm_z42.c para builds Zephyr)
; Headers extras: include/ (MKL25Z4.h, pwm_z42.h, kl25z.ld)
;
; Para builds diretos via west/cmake, use entregas/zephyr/ como app dir.

[env:frdm_kl25z]
platform = freescalekinetis
board = frdm_kl25z
framework = zephyr

; Expõe MKL25Z4.h e pwm_z42.h para o compilador
build_flags = -I${PROJECT_DIR}/include
[platformio]
description = Atividades para entrega da matéria
