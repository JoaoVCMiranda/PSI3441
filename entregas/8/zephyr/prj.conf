# Console via UART0 (USB-serial do DAPLINK)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_PRINTK=y

# ADC — driver e Kconfig do canal
CONFIG_ADC=y

# GPIO (não usado diretamente, mas depende o BSP do KL25Z)
CONFIG_GPIO=y

# Logging assíncrono (deferred) — ring buffer de 2 KB
# Sob carga alta, o buffer satura e mensagens LOG_INF são descartadas;
# é exatamente isso que a atividade pede para investigar.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_DEFAULT_LEVEL=3

# Pilha do main maior para inicialização
CONFIG_MAIN_STACK_SIZE=512
