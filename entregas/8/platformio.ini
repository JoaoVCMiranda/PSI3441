; Entrega 8 — Aquisição de Dados em Tempo Real
; Build + flash: pio run -t upload
; Monitor:       pio device monitor --baud 115200
; Python:        python monitor.py /dev/ttyACM0

[platformio]
description = Atividade 8 — Aquisição ADC tempo real + FIR + logging

[env:frdm_kl25z]
platform = freescalekinetis
board = frdm_kl25z
framework = zephyr
board_build.cmake_extra_args = -DCONF_FILE=zephyr/prj.conf
upload_protocol = cmsis-dap
debug_tool = cmsis-dap

; Para testar sem filtro FIR:
;   build_flags = -DUSE_FIR=0
; Com filtro (padrão — comente a linha acima):
build_flags = -DUSE_FIR=1
