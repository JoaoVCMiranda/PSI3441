# Console via UART (substitui uart_init() manual do bare-metal)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# GPIO Zephyr — necessário para gpio_pin_configure / gpio_pin_set / gpio_pin_get
CONFIG_GPIO=y

# Desabilita o driver Zephyr de PWM para evitar conflito com pwm_z42 no TPM2.
# A lib do prof. Rehder acessa TPM2 diretamente via MKL25Z4.h.
CONFIG_PWM=n
