; Entrega 2 — Controle Interativo de Cor via PWM + Terminal
; Build + flash: pio run -t upload
; Monitor serial: pio device monitor --baud 115200

[platformio]
description = Entrega 2 — LED RGB via TPM (pwm_z42) + controle por terminal

[env:frdm_kl25z]
platform = freescalekinetis
board = frdm_kl25z
framework = zephyr

; pwm_z42.h e MKL25Z4.h ficam em entregas/include/
build_flags = -I../include
