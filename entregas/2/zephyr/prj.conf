# PSI3441 Atividade 2 — Controle de Cor via PWM + Terminal

# Console via UART0 (USB-serial do DAPLINK)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_PRINTK=y

# GPIO — necessário para que o Zephyr inicialize os clocks de PORTB/PORTD
# (SCGC5), que o pwm_z42 reutiliza ao configurar os pinos TPM
CONFIG_GPIO=y
CONFIG_PINMUX=y

# Desabilita o driver Zephyr de PWM: TPM0 e TPM2 são controlados
# diretamente via pwm_z42 (bare-metal), sem conflito com a API Zephyr
CONFIG_PWM=n
