; Template PlatformIO — FRDM-KL25Z + Zephyr
; Duplique esta pasta para iniciar uma nova entrega.
; Build + flash: pio run -t upload
; Monitor serial: pio device monitor --baud 115200

[platformio]
description = Template — substitua pela descrição da entrega

[env:frdm_kl25z]
platform = freescalekinetis
board = frdm_kl25z
framework = zephyr

; prj.conf fica em zephyr/ (PlatformIO procura nesse caminho)
;board_build.cmake_extra_args = -DCONF_FILE=zephyr/prj.conf

; Headers locais: MKL25Z4.h e qualquer lib do include/ do repo
build_flags = -I${PROJECT_DIR}/../include

; Descomenta se precisar de uma lib extra (ex: pwm_z42)
; lib_deps = file://../lib/pwm_z42
