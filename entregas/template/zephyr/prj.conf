# Zephyr Kconfig — habilite apenas o que a entrega usa

# Console via UART0 (USB-serial do DAPLINK)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# GPIO
CONFIG_GPIO=y

# Descomente conforme necessário:
